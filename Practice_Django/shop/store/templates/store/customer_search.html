<!-- customer_search.html -->
{% extends "store/base.html" %}
{% block content %}
  <h2>Search Customers</h2>
  <form method="get">
    {{ form.as_p }}
    <button type="submit">Search</button>
  </form>
  {% if results %}
    <ul>
      {% for customer in results %}
        <li>{{ customer.name }} - {{ customer.email }}</li>
      {% endfor %}
    </ul>
  {% elif query %}
    <p>No customer found for "{{ query }}"</p>
  {% endif %}
{% endblock %}
