{% extends "store/base.html" %}
{% block content %}
<h1>Product List</h1>
<a href="{% url 'product_create' %}">Add Product</a>   |
<a href="{% url 'product_search' %}">Search Product</a>
<ul>
    {% for product in object_list %}
        <li>
            <a href="{% url 'product_detail' product.pk %}">{{ product.name }}</a>
            ({{ product.price }} USD)
        </li>
    {% endfor %}
</ul>
{% endblock %}
