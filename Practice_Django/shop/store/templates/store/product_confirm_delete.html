{% extends "store/base.html" %}
{% block content %}
<h1>Delete Product: {{ object.name }}</h1>
<p>Are you sure you want to delete this product?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>
<a href="{% url 'product_list' %}">Cancel</a>
{% endblock %}
