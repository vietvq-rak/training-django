{% extends "store/base.html" %}
{% block content %}
  <h1>Search Products</h1>
  <form method="get">
    {{ form.as_p }}
    <button type="submit">Search</button>
  </form>

  {% if results %}
    <h2>Results:</h2>
    <ul>
      {% for product in results %}
        <li>{{ product.name }} - {{ product.price }} USD</li>
      {% endfor %}
    </ul>
  {% elif query %}
    <p>No results found for "{{ query }}"</p>
  {% endif %}
{% endblock %}
