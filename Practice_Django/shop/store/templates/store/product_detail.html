{% extends "store/base.html" %}
{% block content %}
<h1>{{ object.name }}</h1>
<p>Price: {{ object.price }} USD</p>

<a href="{% url 'product_update' object.pk %}">Edit</a> |
<a href="{% url 'product_delete' object.pk %}">Delete</a> |
<a href="{% url 'product_list' %}">Back to Product List</a>
{% endblock %}
