{% extends "store/base.html" %}
{% block content %}
<h1>Order List</h1>
<a href="{% url 'order_create' %}">Create Order</a>   |
<a href="{% url 'order_search' %}">Search Orders</a>
<ul>
    {% for order in object_list %}
        <li>
            <a href="{% url 'order_detail' order.pk %}">Order #{{ order.pk }} - {{ order.customer.name }}</a>
        </li>
    {% endfor %}
</ul>
<a href="/">Back to Home</a>
{% endblock %}
