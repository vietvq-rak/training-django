{% extends 'store/base.html' %}
{% block content %}
<h2>Your Orders</h2>
<a href="{% url 'order_create' %}">Create New Order</a>
<ul>
    {% for order in object_list %}
    <li><a href="{% url 'order_detail' order.pk %}">Order #{{ order.id }}</a> - {{ order.date }} - {% if order.status %}Completed{% else %}Pending{% endif %}</li>
    {% endfor %}
</ul>
{% endblock %}
