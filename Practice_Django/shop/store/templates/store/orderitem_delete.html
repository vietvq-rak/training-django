{% extends 'store/base.html' %}

{% block content %}
  <h2>Xóa sản phẩm khỏi đơn hàng?</h2>
  <p>Bạn có chắc muốn xóa {{ object.product.name }} ({{ object.quantity }} cái) không?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Xác nhận</button>
    <a href="{% url 'order_detail' object.order.pk %}">Hủy</a>
  </form>
{% endblock %}
