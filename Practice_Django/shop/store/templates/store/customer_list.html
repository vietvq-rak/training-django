{% extends "store/base.html" %}
{% block content %}
<h1>Customer List</h1>
<a href="{% url 'customer_create' %}">Add Customer</a>   |
<a href="{% url 'customer_search' %}">Search Customer</a>
<ul>
    {% for customer in object_list %}
        <li>
            <a href="{% url 'customer_detail' customer.pk %}">{{ customer.name }}</a>
        </li>
    {% endfor %}
</ul>
<a href="/">Back to Home</a>
{% endblock %}
