{% extends "store/base.html" %}

{% block content %}
<h2>Sign Up</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
    <button type="button" class="js-captcha-refresh" data-url="/captcha/refresh/">↻ Reload CAPTCHA</button>
</form>
{% if form.errors %}
    <ul>
        {% for field, errors in form.errors.items %}
            <li>{{ field }}: {{ errors|join:", " }}</li>
        {% endfor %}
    </ul>s
{% endif %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $('.js-captcha-refresh').click(function(e){
        e.preventDefault();
        const $btn = $(this);

        $.getJSON($btn.data('url'), {}, function(json) {
            $('img.captcha').attr('src', json.image_url);
            $('input[name="captcha_0"]').val(json.key);
        });

        return false;
    });
</script>
{% endblock %}
